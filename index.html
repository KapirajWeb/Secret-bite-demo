<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="The Secret Bite - a modern cafe experience in Rajkot."
  >

  <title>The Secret Bite | Rajkot</title>

  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #ffffff;
      overflow-x: hidden;
    }

    img {
      width: 100%;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font-family: inherit;
    }

    :root {
      --gold: #f5b942;
      --gold-light: #ffd878;
      --dark: #0b0b0b;
      --dark-2: #121212;
      --dark-3: #1b1b1b;
      --text: #ffffff;
      --muted: #a7a7a7;
      --border: rgba(255,255,255,0.09);
      --radius: 20px;
    }

    .container {
      width: min(1150px, 90%);
      margin: auto;
    }


    /* =========================================================
       SCROLLBAR
    ========================================================= */

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #090909;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 20px;
    }


    /* =========================================================
       TOP DEMO NOTICE
    ========================================================= */

    .demo-bar {
      background: #171717;
      color: #a8a8a8;
      text-align: center;
      padding: 8px 15px;
      font-size: 11px;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }


    /* =========================================================
       NAVIGATION
    ========================================================= */

    .navbar {
      position: fixed;
      top: 32px;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 18px 0;
      transition: 0.3s ease;
    }

    .navbar.scrolled {
      background: rgba(8,8,8,0.92);
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .nav-inner {
      width: min(1150px, 90%);
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .logo span {
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      font-size: 14px;
      color: #eeeeee;
      transition: 0.25s;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .nav-book {
      padding: 11px 19px;
      border: 1px solid var(--gold);
      border-radius: 30px;
      color: var(--gold) !important;
    }

    .nav-book:hover {
      background: var(--gold);
      color: #111 !important;
    }

    .menu-toggle {
      display: none;
      background: transparent;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      background:
        linear-gradient(
          rgba(0,0,0,0.58),
          rgba(0,0,0,0.86)
        ),
        url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1800&q=85");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .hero-content {
      width: min(850px, 90%);
      animation: heroIn 1s ease forwards;
    }

    @keyframes heroIn {
      from {
        opacity: 0;
        transform: translateY(35px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-small {
      display: inline-block;
      color: var(--gold);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(50px, 10vw, 105px);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -4px;
      margin-bottom: 25px;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero-description {
      max-width: 650px;
      margin: auto;
      color: #d4d4d4;
      font-size: 18px;
      line-height: 1.7;
    }

    .hero-buttons {
      margin-top: 35px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 14px 25px;
      border-radius: 50px;
      background: var(--gold);
      color: #101010;
      font-weight: 800;
      font-size: 14px;
      margin: 5px;
      border: 1px solid var(--gold);
      transition: 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-4px);
      background: var(--gold-light);
      box-shadow: 0 12px 30px rgba(245,185,66,0.18);
    }

    .btn-outline {
      background: transparent;
      color: white;
      border-color: rgba(255,255,255,0.6);
    }

    .btn-outline:hover {
      background: white;
      color: black;
      border-color: white;
    }

    .scroll-down {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: #aaa;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .scroll-line {
      width: 1px;
      height: 35px;
      background: var(--gold);
      margin: 8px auto 0;
      animation: scrollMove 1.5s infinite;
    }

    @keyframes scrollMove {
      0%, 100% {
        transform: scaleY(0.5);
        transform-origin: top;
      }

      50% {
        transform: scaleY(1);
        transform-origin: top;
      }
    }


    /* =========================================================
       SECTION BASICS
    ========================================================= */

    section {
      padding: 105px 0;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 55px;
    }

    .section-label {
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 3px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .section-heading h2 {
      font-size: clamp(34px, 5vw, 55px);
      line-height: 1.05;
      margin-bottom: 17px;
    }

    .section-heading p {
      color: var(--muted);
      max-width: 650px;
      margin: auto;
      line-height: 1.7;
    }


    /* =========================================================
       INTRO
    ========================================================= */

    .intro {
      background: var(--dark);
    }

    .intro-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 65px;
      align-items: center;
    }

    .intro-image {
      border-radius: 25px;
      overflow: hidden;
      position: relative;
    }

    .intro-image img {
      height: 500px;
      object-fit: cover;
      transition: 0.7s;
    }

    .intro-image:hover img {
      transform: scale(1.05);
    }

    .intro-image::after {
      content: "";
      position: absolute;
      inset: 15px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 18px;
      pointer-events: none;
    }

    .intro-text h2 {
      font-size: clamp(35px, 5vw, 58px);
      line-height: 1.05;
      margin-bottom: 25px;
    }

    .intro-text h2 span {
      color: var(--gold);
    }

    .intro-text p {
      color: #aaa;
      line-height: 1.9;
      margin-bottom: 18px;
    }

    .intro-points {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 30px;
    }

    .intro-point {
      background: var(--dark-3);
      border: 1px solid var(--border);
      padding: 18px;
      border-radius: 15px;
    }

    .intro-point strong {
      display: block;
      color: var(--gold);
      margin-bottom: 5px;
    }

    .intro-point span {
      color: #aaa;
      font-size: 13px;
    }


    /* =========================================================
       MENU
    ========================================================= */

    .menu-section {
      background: #111111;
    }

    .menu-filter {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 35px;
    }

    .filter-btn {
      padding: 10px 19px;
      border-radius: 30px;
      border: 1px solid #333;
      background: transparent;
      color: #aaa;
      cursor: pointer;
      transition: 0.25s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: var(--gold);
      color: #111;
      border-color: var(--gold);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .food-card {
      background: #181818;
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      transition: 0.35s ease;
    }

    .food-card:hover {
      transform: translateY(-8px);
      border-color: rgba(245,185,66,0.5);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .food-image {
      height: 220px;
      overflow: hidden;
    }

    .food-image img {
      height: 100%;
      object-fit: cover;
      transition: 0.6s;
    }

    .food-card:hover .food-image img {
      transform: scale(1.08);
    }

    .food-info {
      padding: 22px;
    }

    .food-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .food-top h3 {
      font-size: 18px;
    }

    .food-price {
      color: var(--gold);
      font-weight: bold;
      white-space: nowrap;
    }

    .food-info p {
      color: #888;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 10px;
    }

    .food-tag {
      display: inline-block;
      margin-top: 15px;
      padding: 5px 9px;
      border-radius: 20px;
      background: rgba(245,185,66,0.1);
      color: var(--gold);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }


    /* =========================================================
       STATS
    ========================================================= */

    .stats {
      padding: 60px 0;
      background: var(--gold);
      color: #111;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
    }

    .stat {
      padding: 15px;
      border-right: 1px solid rgba(0,0,0,0.18);
    }

    .stat:last-child {
      border-right: none;
    }

    .stat h3 {
      font-size: 38px;
      margin-bottom: 5px;
    }

    .stat p {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: bold;
    }


    /* =========================================================
       EXPERIENCE
    ========================================================= */

    .experience {
      background: var(--dark);
    }

    .experience-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .experience-card {
      min-height: 320px;
      padding: 35px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: linear-gradient(
        145deg,
        #1c1c1c,
        #101010
      );
      transition: 0.35s;
    }

    .experience-card:hover {
      transform: translateY(-8px);
      border-color: rgba(245,185,66,0.45);
    }

    .experience-icon {
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 15px;
      background: rgba(245,185,66,0.12);
      color: var(--gold);
      font-size: 25px;
      margin-bottom: 30px;
    }

    .experience-card h3 {
      font-size: 23px;
      margin-bottom: 15px;
    }

    .experience-card p {
      color: #888;
      line-height: 1.8;
    }


    /* =========================================================
       GALLERY
    ========================================================= */

    .gallery-section {
      background: #111;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 220px;
      gap: 12px;
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 16px;
      position: relative;
    }

    .gallery-item.large {
      grid-column: span 2;
      grid-row: span 2;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.6s;
    }

    .gallery-item::after {
      content: "View";
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.45);
      opacity: 0;
      transition: 0.3s;
      color: white;
      font-weight: bold;
    }

    .gallery-item:hover img {
      transform: scale(1.08);
    }

    .gallery-item:hover::after {
      opacity: 1;
    }


    /* =========================================================
       REVIEWS
    ========================================================= */

    .reviews-section {
      background: var(--dark);
    }

    .reviews-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .review-card {
      background: #181818;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px;
    }

    .stars {
      color: var(--gold);
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .review-card p {
      color: #aaa;
      line-height: 1.8;
      font-style: italic;
      margin-bottom: 25px;
    }

    .review-author {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--gold);
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .review-author strong {
      font-size: 14px;
    }

    .review-author small {
      display: block;
      color: #777;
      margin-top: 3px;
    }


    /* =========================================================
       CTA
    ========================================================= */

    .cta {
      padding: 90px 0;
      background:
        linear-gradient(
          rgba(0,0,0,0.7),
          rgba(0,0,0,0.85)
        ),
        url("https://images.unsplash.com/photo-1552566626-52f8b828add9?auto=format&fit=crop&w=1600&q=85");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .cta-box {
      text-align: center;
      max-width: 750px;
      margin: auto;
    }

    .cta-box h2 {
      font-size: clamp(35px, 6vw, 60px);
      margin-bottom: 18px;
    }

    .cta-box p {
      color: #bbb;
      line-height: 1.7;
      margin-bottom: 25px;
    }


    /* =========================================================
       LOCATION
    ========================================================= */

    .location-section {
      background: #111;
    }

    .location-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .location-card {
      background: #181818;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 35px;
    }

    .location-card h3 {
      font-size: 25px;
      margin-bottom: 25px;
    }

    .location-row {
      display: flex;
      gap: 15px;
      margin-bottom: 22px;
    }

    .location-icon {
      color: var(--gold);
      font-size: 21px;
    }

    .location-row strong {
      display: block;
      margin-bottom: 5px;
    }

    .location-row span {
      color: #888;
      line-height: 1.6;
      font-size: 14px;
    }

    .map-box {
      min-height: 400px;
      border-radius: 22px;
      overflow: hidden;
      background: #181818;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .map-content {
      max-width: 350px;
    }

    .map-icon {
      font-size: 55px;
      margin-bottom: 20px;
    }

    .map-content h3 {
      margin-bottom: 10px;
    }

    .map-content p {
      color: #888;
      line-height: 1.6;
      margin-bottom: 20px;
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      background: #070707;
      padding: 65px 0 25px;
      border-top: 1px solid var(--border);
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 50px;
      margin-bottom: 50px;
    }

    .footer-brand h2 {
      font-size: 25px;
      margin-bottom: 15px;
    }

    .footer-brand h2 span {
      color: var(--gold);
    }

    .footer-brand p {
      color: #777;
      max-width: 350px;
      line-height: 1.7;
    }

    .footer-column h3 {
      font-size: 14px;
      margin-bottom: 20px;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .footer-column a {
      display: block;
      color: #777;
      margin-bottom: 12px;
      font-size: 13px;
      transition: 0.2s;
    }

    .footer-column a:hover {
      color: white;
    }

    .footer-bottom {
      border-top: 1px solid var(--border);
      padding-top: 22px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #555;
      font-size: 11px;
    }


    /* =========================================================
       FLOATING WHATSAPP
    ========================================================= */

    .whatsapp {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #25D366;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      z-index: 900;
      transition: 0.3s;
    }

    .whatsapp:hover {
      transform: scale(1.1);
    }


    /* =========================================================
       SCROLL REVEAL
    ========================================================= */

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: 0.8s ease;
    }

    .reveal.show {
      opacity: 1;
      transform: translateY(0);
    }


    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 900px) {

      .intro-grid {
        grid-template-columns: 1fr;
      }

      .intro-image img {
        height: 400px;
      }

      .menu-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .experience-grid {
        grid-template-columns: 1fr 1fr;
      }

      .reviews-grid {
        grid-template-columns: 1fr 1fr;
      }

      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .location-grid {
        grid-template-columns: 1fr;
      }

      .footer-grid {
        grid-template-columns: 1fr 1fr;
      }
    }


    @media (max-width: 650px) {

      .demo-bar {
        font-size: 9px;
      }

      .navbar {
        top: 28px;
      }

      .nav-links {
        position: absolute;
